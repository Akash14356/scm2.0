<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" 
    <link data-th-href="@{'/css/output.css'}" rel="stylesheet">

</head>
<body>

<div class="bg-gray-200 w-1/2 p-4 flex flex-col items-center space-y-3 mx-auto mt-10">

    <h1 class="text-2xl font-bold" data-th-text="${name}">
        Welcome to the Home Page
    </h1>

    <p class="text-xl text-gray-600">
        YouTube Channel:
        <span data-th-text="${youtubeChannel}"></span>
    </p>

    <p>
        GitHub:
        <span data-th-text="${github}"></span>
    </p>

    <p>
        <a data-th-href="${myYoutubechannelLink}" target="_blank">
            Visit My YouTube Channel
        </a>
    </p>
    <div>
        <button class="px-3 py-3 rounded bg-blue-700 text-white hover:bg-blue-600">click here</button>
    </div>

</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"> </script>

</body> </html>
